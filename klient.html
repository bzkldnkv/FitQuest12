<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FitQuest</title>
<link rel="manifest" href='data:application/json,{"name":"FitQuest","short_name":"FitQuest","display":"standalone","start_url":"./klient.html","background_color":"%23171a26","theme_color":"%235b5bf0"}'>
<style>
:root{--bg:#f2f3f8;--bg2:#ffffff;--tx:#171a26;--tx2:#6a7086;--line:#e6e8f0;--card:#ffffff;--acc:#5b5bf0;--acc2:#8b5cf6;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--rad:20px;--sh:0 10px 30px rgba(23,26,38,.08),0 2px 8px rgba(23,26,38,.05)}
body.dark{--bg:#0d1020;--bg2:#141830;--tx:#eef0fa;--tx2:#9aa0bd;--line:#252a48;--card:#181c34;--sh:0 10px 30px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px 300px at 15% -5%,rgba(91,91,240,.16),transparent 60%),radial-gradient(500px 280px at 90% 10%,rgba(139,92,246,.12),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(91,91,240,.10),transparent 60%)}
main,header,nav{position:relative;z-index:1}
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hbtn{display:flex;gap:8px;align-items:center}
main{max-width:1040px;margin:0 auto;padding:24px 20px 120px}
h1.title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 18px}
h2.sec{font-size:15px;font-weight:700;color:var(--tx2);margin:26px 0 12px;text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:18px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.bento{grid-template-columns:1fr 1fr}}
.tile{padding:18px;position:relative}
.tile::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;right:-40px;top:-40px;background:linear-gradient(135deg,rgba(91,91,240,.14),rgba(139,92,246,.05))}
.tile .lbl{font-size:13px;color:var(--tx2);font-weight:600}
.tile .val{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:6px}
.tile.hero{grid-column:1/-1;background:linear-gradient(120deg,#5b5bf0,#8b5cf6);color:#fff;border:none}
.tile.hero::after{background:rgba(255,255,255,.14)}
.tile.hero .lbl{color:rgba(255,255,255,.8)}
.cap{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:8px}
.cap.up{background:rgba(22,163,74,.12);color:var(--ok)}
.cap.down{background:rgba(220,38,38,.12);color:var(--bad)}
.cap.warn{background:rgba(217,119,6,.14);color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:14px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(91,91,240,.35);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:rgba(220,38,38,.1);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inp{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--tx);outline:none;transition:border .2s}
.inp:focus{border-color:var(--acc)}
label.fl{display:block;font-size:13px;color:var(--tx2);font-weight:600;margin:12px 0 6px}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s;box-shadow:var(--sh)}
.item:hover{transform:translateY(-2px)}
.av{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.ring{width:40px;height:40px;flex-shrink:0}
.ring circle.bg{stroke:var(--line)}
.ring circle.fg{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset .6s}
.nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:var(--sh)}
.nav button{background:none;border:none;color:var(--tx2);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;border-radius:14px;flex:1}
.nav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.nav .ic{font-size:19px;line-height:1}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,12,24,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.modal.open{display:flex}
.mcard{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px;animation:up .25s ease}
@media(min-width:700px){.mcard{border-radius:24px;animation:pop .2s ease}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.errbox{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#dc2626;color:#fff;padding:12px 16px;font:13px/1.4 monospace;white-space:pre-wrap}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bars .b{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));margin-top:6px;transition:width .5s}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.tgl{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);cursor:pointer;transition:.2s;flex-shrink:0;border:none}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tgl.on{background:var(--ok)}
.tgl.on::after{left:23px}
.tabbar{display:flex;gap:8px;margin:14px 0}
.tabbar button{background:var(--bg2);border:1.5px solid var(--line);color:var(--tx2);padding:8px 16px;border-radius:99px;font-size:13.5px;font-weight:700;cursor:pointer}
.tabbar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.pill.red{background:rgba(220,38,38,.12);color:var(--bad)}
.pill.green{background:rgba(22,163,74,.12);color:var(--ok)}
.pill.blue{background:rgba(91,91,240,.12);color:var(--acc)}
.pill.gray{background:var(--line);color:var(--tx2)}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;margin:4px 0}
.msg.me{background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.msg.them{background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:5px}
.empty{text-align:center;color:var(--tx2);padding:30px 10px;font-size:14px}
.chart{width:100%;height:120px}
</style><link rel="icon" href="data:,">
</head>
<body>
<div id="errbox" class="errbox"></div>
<header class="hdr"><div class="hdr-in">
<div class="logo">Fit<span style="font-weight:400">Quest</span></div>
<div class="hbtn"><button class="btn ghost sm" id="themeBtn" data-act="theme">🌙</button></div>
</div></header>
<main id="app" class="fade"></main>
<nav class="nav" id="nav"></nav>
<div class="modal" id="modal" data-act="closemodal"><div class="mcard" id="mcard"></div></div>
<div class="toast" id="toast"></div>
<script>
window.addEventListener('error',function(e){var b=document.getElementById('errbox');b.style.display='block';b.textContent='Ошибка скрипта: '+e.message+' (строка '+e.lineno+')';});
var KEY='fitquest_v3';
var S=null;
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.clients&&o.clients.length!==undefined)return o;}}catch(e){}return demoTrainer();}
function demoTrainer(){return{auth:false,theme:'auto',invite:'FIT-7K2Q',tariffs:[{n:'Индивидуальная',p:2500},{n:'Онлайн',p:1800},{n:'Пилатес группа',p:1900}],
clients:[
{id:'c1',name:'Анна Смирнова',login:'anna',pass:'1234',emoji:'🐰',c:'#f59e0b',xp:420,streak:5,blockDay:5,blockLen:21,disc:10,lastActive:2,sub:{left:6,total:12,frozen:false},notes:'',tags:[],quests:[{n:'Блок «Спина и осанка»',d:5,t:21},{n:'Привычка: 8000 шагов',d:12,t:30}],measures:[{d:'01.10',w:62.5},{d:'08.10',w:62.1},{d:'15.10',w:61.4},{d:'22.10',w:60.9},{d:'29.10',w:60.2}],chat:[{who:'them',t:'Привет! Готова к завтрашнему отчёту 💪'}],report:null},
{id:'c2',name:'Иван Петров',login:'ivan',pass:'1234',emoji:'🐻',c:'#3b82f6',xp:150,streak:0,blockDay:2,blockLen:21,disc:0,lastActive:7,sub:{left:2,total:8,frozen:false},notes:'',tags:[],quests:[{n:'Блок «База: всё тело»',d:2,t:21}],measures:[{d:'20.10',w:84.0},{d:'27.10',w:83.2}],chat:[],report:null}],
sessions:[{id:'s1',date:0,time:'10:00',title:'Пилатес (группа)',price:1900,type:'group',who:['c1'],paid:['c1']},{id:'s2',date:0,time:'18:30',title:'Индивидуальная',price:2500,type:'indiv',who:['c2'],paid:[]},{id:'s3',date:1,time:'09:00',title:'Онлайн',price:1800,type:'online',who:['c1'],paid:[]}],
rewards:[{n:'Скидка 10% на месяц',cost:300},{n:'Гостевой визит для друга',cost:500},{n:'Фитнес-марафон бесплатно',cost:1000}],purchases:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2200);}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d;}
function fmt(d){return d.getDate()+' '+['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];}
var VIEW='home',TABS={home:'🏠|Главная',quests:'🎯|Квесты',prog:'📈|Прогресс',shop:'🎁|Лавка',chat:'💬|Чат'};
function applyTheme(){var t=S.theme||'auto';if(t==='auto'){t=(new Date().getHours()>=20||new Date().getHours()<8)?'dark':'light';}document.body.classList.toggle('dark',t==='dark');var b=document.getElementById('themeBtn');if(b)b.textContent=t==='dark'?'☀️':'🌙';}
function setTheme(){S.theme=document.body.classList.contains('dark')?'light':'dark';save();applyTheme();}
function me(){if(!window._me)return null;for(var i=0;i<S.clients.length;i++)if(S.clients[i].id===window._me)return S.clients[i];return null;}
function lvl(xp){return Math.floor(xp/100)+1;}
function renderNav(){var n=document.getElementById('nav');if(!window._me){n.style.display='none';return;}n.style.display='flex';var h='';for(var k in TABS){var p=TABS[k].split('|');h+='<button data-act="nav" data-v="'+k+'" class="'+(VIEW===k?'on':'')+'"><span class="ic">'+p[0]+'</span>'+p[1]+'</button>';}n.innerHTML=h;}
function go(v){VIEW=v;renderNav();render();}
function render(){var a=document.getElementById('app');a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade');if(!window._me){a.innerHTML=renderAuth();return;}var f={home:rHome,quests:rQuests,prog:rProg,shop:rShop,chat:rChat}[VIEW];a.innerHTML=f?f():'';}
function renderAuth(){var h='<div style="max-width:380px;margin:10vh auto"><div class="card" style="padding:30px;text-align:center"><div style="font-size:44px">🔥</div><h1 style="font-size:22px;margin:10px 0">FitQuest</h1><p style="color:var(--tx2);font-size:14px;margin-bottom:6px">Квесты, XP и награды от вашего тренера</p>';
if(!window._reg){h+='<button class="btn" style="width:100%;justify-content:center;margin-top:14px" data-act="showreg">Регистрация по коду тренера</button><button class="btn ghost" style="width:100%;justify-content:center;margin-top:10px" data-act="showlogin">Вход</button>';}
else{h+='<label class="fl" style="text-align:left">Код тренера</label><input class="inp" id="rinv" value="'+esc(new URLSearchParams(location.search).get('invite')||'')+'"><label class="fl" style="text-align:left">Ваше имя</label><input class="inp" id="rname"><label class="fl" style="text-align:left">Логин</label><input class="inp" id="rlogin"><label class="fl" style="text-align:left">Пароль</label><input class="inp" id="rpass" type="password"><button class="btn" style="width:100%;justify-content:center;margin-top:16px" data-act="doreg">Начать путь 🚀</button>';}
if(window._lg){h='<div class="card" style="padding:30px;text-align:center"><div style="font-size:44px">👋</div><h1 style="font-size:22px;margin:10px 0">С возвращением</h1><label class="fl" style="text-align:left">Логин</label><input class="inp" id="llogin"><label class="fl" style="text-align:left">Пароль</label><input class="inp" id="lpass" type="password"><button class="btn" style="width:100%;justify-content:center;margin-top:16px" data-act="dologin">Войти</button><button class="btn ghost sm" style="margin-top:10px" data-act="backreg">Назад</button></div>';}
return h+'</div></div>';}
function rHome(){var c=me();var pct=Math.round(c.blockDay/c.blockLen*100);
var h='<div class="card tile hero" style="padding:22px;margin-bottom:14px"><div class="lbl">'+esc(c.name)+' · уровень '+lvl(c.xp)+'</div><div class="val" style="font-size:34px">'+c.xp+' XP</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><span class="cap" style="background:rgba(255,255,255,.2);color:#fff">🔥 серия '+c.streak+'</span><span class="cap" style="background:rgba(255,255,255,.2);color:#fff">🎯 блок '+pct+'%</span>'+(c.disc?'<span class="cap" style="background:rgba(255,255,255,.2);color:#fff">скидка '+c.disc+'%</span>':'')+'</div><div class="track" style="margin-top:14px;background:rgba(255,255,255,.25)"><div class="bars" style="width:'+pct+'%;background:#fff"></div></div></div>';
h+='<h2 class="sec">Мои квесты</h2><div class="list">';
c.quests.forEach(function(q){h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(q.n)+'</b><span class="pill blue">'+q.d+'/'+q.t+'</span></div><div class="track" style="margin-top:10px"><div class="bars" style="width:'+Math.round(q.d/q.t*100)+'%"></div></div></div>';});
if(!c.quests.length)h+='<div class="empty">Тренер скоро назначит первые квесты</div>';
h+='</div><h2 class="sec">Ближайшие занятия</h2><div class="list">';
var any=false;S.sessions.forEach(function(s){if(s.who.indexOf(c.id)<0)return;any=true;var d=new Date(today0());d.setDate(d.getDate()+s.date);
h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(s.title)+'</b><span class="pill '+(s.paid.indexOf(c.id)>=0?'green':'red')+'">'+(s.paid.indexOf(c.id)>=0?'оплачено':'ждёт оплаты')+'</span></div><div style="font-size:13px;color:var(--tx2);margin-top:6px">'+(s.date===0?'сегодня':s.date===1?'завтра':fmt(d))+' · '+s.time+'</div></div>';});
if(!any)h+='<div class="empty">Занятий пока нет</div>';
return h+'</div>';}
function rQuests(){var c=me();var h='<h1 class="title">Квесты</h1><div class="list">';
c.quests.forEach(function(q,i){h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(q.n)+'</b><span class="pill blue">'+q.d+'/'+q.t+' дней</span></div><div class="track" style="margin:10px 0"><div class="bars" style="width:'+Math.round(q.d/q.t*100)+'%"></div></div><div class="row" style="justify-content:space-between"><span style="font-size:13px;color:var(--tx2)">Отметить сегодняшний день</span><button class="tgl '+(window._doneq===i?'on':'')+'" data-act="qday" data-i="'+i+'"></button></div></div>';});
if(!c.quests.length)h+='<div class="empty">Квестов пока нет</div>';
h+='<h2 class="sec">Отправить отчёт</h2><div class="card"><input class="inp" id="repq" placeholder="За какой квест"><textarea class="inp" id="rept" placeholder="Как прошло?" style="margin-top:10px;min-height:70px;resize:vertical"></textarea><button class="btn" style="margin-top:12px" data-act="sendrep">Отправить тренеру 📤</button></div>';
return h+'</div>';}
function rProg(){var c=me();var h='<h1 class="title">Прогресс</h1><div class="bento" style="margin-bottom:14px"><div class="card tile"><div class="lbl">Уровень</div><div class="val">'+lvl(c.xp)+'</div></div><div class="card tile"><div class="lbl">Серия</div><div class="val">🔥 '+c.streak+'</div></div></div>';
h+='<h2 class="sec">Замеры (вес, кг)</h2><div class="card"><canvas id="wchart" class="chart"></canvas><div class="row" style="margin-top:12px"><input class="inp" id="mw" type="number" step="0.1" placeholder="Новый вес" style="flex:1"><button class="btn sm" data-act="addmeas">＋ Добавить</button></div></div>';
h+='<h2 class="sec">Абонемент</h2><div class="card"><div class="row" style="justify-content:space-between"><span>Осталось занятий</span><b>'+c.sub.left+' из '+c.sub.total+'</b></div>'+(c.sub.frozen?'<span class="cap warn" style="margin-top:8px">❄️ Заморожен</span>':'')+'</div>';
return h;}
function rShop(){var c=me();var h='<h1 class="title">Лавка</h1><div class="card tile hero" style="margin-bottom:14px"><div class="lbl">Ваш баланс</div><div class="val">'+c.xp+' XP</div></div><div class="list">';
S.rewards.forEach(function(r,i){var can=c.xp>=r.cost;
h+='<div class="card" style="display:flex;align-items:center;gap:12px"><div style="flex:1"><b>'+esc(r.n)+'</b><div style="font-size:12.5px;color:var(--tx2)">'+r.cost+' XP</div></div><button class="btn sm '+(can?'':'ghost')+'" '+(can?'':'disabled style="opacity:.5"')+' data-act="buy" data-i="'+i+'">Купить</button></div>';});
if(!S.rewards.length)h+='<div class="empty">Награды скоро появятся</div>';
return h+'</div>';}
function rChat(){var c=me();var h='<h1 class="title">Чат с тренером</h1><div class="card" style="padding:14px"><div style="max-height:50vh;overflow:auto" id="chatbox">';
(c.chat||[]).forEach(function(m){h+='<div class="msg '+(m.who==='me'?'me':'them')+'">'+esc(m.t)+'</div>';});
if(!(c.chat||[]).length)h+='<div class="empty">Напишите тренеру первое сообщение</div>';
h+='</div></div><div class="row" style="margin-top:12px;position:sticky;bottom:80px"><input class="inp" id="cmsg" placeholder="Сообщение…" style="flex:1" onkeydown="if(event.key===&apos;Enter&apos;)sendMsg()"><button class="btn" data-act="sendmsg">➤</button></div>';
return h;}
function sendMsg(){var c=me(),el=document.getElementById('cmsg');if(!c||!el||!el.value.trim())return;c.chat=c.chat||[];c.chat.push({who:'me',t:el.value.trim()});save();render();var b=document.getElementById('chatbox');if(b)b.scrollTop=b.scrollHeight;}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act');
if(act==='nav')go(el.getAttribute('data-v'));
else if(act==='theme')setTheme();
else if(act==='closemodal'){if(e.target.id==='modal')document.getElementById('modal').classList.remove('open');}
else if(act==='showreg'){window._reg=true;render();}
else if(act==='backreg'){window._lg=false;render();}
else if(act==='showlogin'){window._lg=true;render();}
else if(act==='doreg'){var inv=document.getElementById('rinv').value.trim().toUpperCase(),nm=document.getElementById('rname').value.trim(),lg=document.getElementById('rlogin').value.trim(),ps=document.getElementById('rpass').value;
if(inv!==S.invite){toast('Неверный код тренера');return;}
if(!nm||!lg||!ps){toast('Заполните все поля');return;}
var dup=S.clients.some(function(x){return x.login===lg;});if(dup){toast('Логин уже занят');return;}
var id='c'+Date.now();S.clients.push({id:id,name:nm,login:lg,pass:ps,emoji:'🙂',c:'#8b5cf6',xp:0,streak:0,blockDay:0,blockLen:21,disc:0,lastActive:0,sub:{left:0,total:8,frozen:false},notes:'',tags:[],quests:[],measures:[],chat:[{who:'them',t:'Добро пожаловать в FitQuest! 🔥'}],report:null});
window._me=id;save();renderNav();go('home');toast('Добро пожаловать, '+nm.split(' ')[0]+'! 🎉');}
else if(act==='dologin'){var l2=document.getElementById('llogin').value.trim(),p2=document.getElementById('lpass').value;
var f=S.clients.find(function(x){return x.login===l2&&x.pass===p2;});if(!f){toast('Неверный логин или пароль');return;}
window._me=f.id;window._lg=false;save();renderNav();go('home');}
else if(act==='qday'){var i=+el.getAttribute('data-i'),c1=me();var q=c1.quests[i];if(window._doneq===i){window._doneq=null;q.d=Math.max(0,q.d-1);}else{window._doneq=i;q.d++;c1.xp+=10;c1.lastActive=0;save();toast('+10 XP 🔥');}save();render();}
else if(act==='sendrep'){var c2=me(),qt=document.getElementById('repq').value.trim(),tx=document.getElementById('rept').value.trim();if(!qt||!tx){toast('Заполните оба поля');return;}
c2.report={quest:qt,date:'сегодня',text:tx};save();render();toast('Отчёт отправлен тренеру 📤');}
else if(act==='addmeas'){var c3=me(),w=parseFloat(document.getElementById('mw').value);if(!w)return;var d=new Date();c3.measures.push({d:d.getDate()+'.'+(d.getMonth()+1),w:w});save();render();toast('Замер записан 📈');}
else if(act==='buy'){var c4=me(),r=S.rewards[+el.getAttribute('data-i')];if(c4.xp<r.cost){toast('Не хватает XP');return;}
S.purchases.push({cid:c4.id,n:r.n});save();toast('Заявка отправлена тренеру ✅');}
else if(act==='sendmsg')sendMsg();});
function drawChart(){var c=me();if(!c)return;var cv=document.getElementById('wchart');if(!cv)return;var d=c.measures;if(d.length<2){var g=cv.getContext('2d');cv.width=cv.offsetWidth*2;cv.height=240;g.font='26px sans-serif';g.fillStyle='#9aa0bd';g.fillText('Добавьте минимум 2 замера',30,130);return;}
var ws=d.map(function(m){return m.w;});var mn=Math.min.apply(null,ws)-1,mx=Math.max.apply(null,ws)+1;
var W=cv.width=cv.offsetWidth*2,H=cv.height=240;var g=cv.getContext('2d');g.clearRect(0,0,W,H);
var pts=d.map(function(m,i){return [40+i*(W-80)/(d.length-1),H-40-(m.w-mn)/(mx-mn)*(H-80)];});
g.strokeStyle='#5b5bf0';g.lineWidth=6;g.lineJoin='round';g.beginPath();pts.forEach(function(p,i){i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);});g.stroke();
pts.forEach(function(p){g.beginPath();g.arc(p[0],p[1],9,0,7);g.fillStyle='#8b5cf6';g.fill();});
g.font='24px sans-serif';g.fillStyle='#9aa0bd';pts.forEach(function(p,i){g.fillText(ws[i],Math.min(p[0]-20,W-70),p[1]-18);});}
var _render=render;render=function(){_render();setTimeout(drawChart,30);};
window.addEventListener('storage',function(){var old=S;S=load();if(old._me!==undefined)window._me=window._me;applyTheme();render();});
function boot(){if(S===null)S=load();applyTheme();
var m=null;for(var i=0;i<(S.clients||[]).length;i++)if(S.clients[i]._session)m=S.clients[i];
renderNav();render();}
boot();
</script>
</body></html>
