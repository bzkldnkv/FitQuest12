<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitQuest — Тренер</title>
    <style>
        :root {
            --bg: #f2f3f8;
            --bg2: #ffffff;
            --tx: #171a26;
            --tx2: #6a7086;
            --line: #e6e8f0;
            --card: #ffffff;
            --acc: #0d9488;
            --acc2: #14b8a6;
            --ok: #16a34a;
            --bad: #dc2626;
            --warn: #d97706;
            --rad: 20px;
            --sh: 0 10px 30px rgba(23, 26, 38, 0.08);
        }
        body.dark {
            --bg: #0d1020;
            --bg2: #141830;
            --tx: #eef0fa;
            --tx2: #9aa0bd;
            --line: #252a48;
            --card: #181c34;
            --sh: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--tx);
            min-height: 100vh;
        }
        /* Header */
        header {
            position: sticky; top: 0; z-index: 50;
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo {
            font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--acc), var(--acc2));
            -webkit-background-clip: text; color: transparent;
        }
        .date-time { font-size: 13px; color: var(--tx2); font-weight: 600; }
        
        /* Sidebar */
        aside {
            position: fixed; top: 70px; left: 20px; bottom: 20px; width: 220px;
            background: color-mix(in srgb, var(--card) 90%, transparent);
            backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 10px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .nav-btn {
            background: none; border: none; color: var(--tx2);
            text-align: left; padding: 10px 12px; border-radius: 12px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
        }
        .nav-btn:hover { background: var(--line); color: var(--tx); }
        .nav-btn.active { background: var(--acc); color: #fff; }
        
        /* Main Content */
        main {
            margin-left: 260px; margin-top: 30px; padding-bottom: 40px;
            max-width: 1000px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        
        /* Пункт 3: Исправление скролл-контейнера */
        .bento-container {
            display: flex; overflow-x: auto; padding-bottom: 10px;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent;
        }
        .bento-container::-webkit-scrollbar { height: 6px; }
        .bento-container::-webkit-scrollbar-track { background: transparent; }
        .bento-container::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
        
        .tile {
            min-width: 180px;
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--line);
            box-shadow: var(--sh);
            display: flex; flex-direction: column; gap: 8px;
        }
        .tile-icon {
            width: 32px; height: 32px;
            background: rgba(13, 148, 136, 0.1);
            color: var(--acc);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .tile-title { font-size: 13px; color: var(--tx2); text-transform: uppercase; letter-spacing: 0.5px; }
        .tile-value { font-size: 24px; font-weight: 700; color: var(--tx); }
        
        /* Пункт 4: Расписание */
        .schedule-card {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--line);
            padding: 20px;
            box-shadow: var(--sh);
        }
        .schedule-item {
            display: flex; flex-direction: column; gap: 10px;
            padding: 12px;
            border-bottom: 1px solid var(--line);
        }
        .schedule-item:last-child { border-bottom: none; }
        .sched-header { display: flex; justify-content: space-between; align-items: center; }
        .sched-time { font-size: 18px; font-weight: 700; color: var(--acc); }
        .sched-type {
            font-size: 11px; text-transform: uppercase;
            background: rgba(13, 148, 136, 0.1);
            color: var(--acc); padding: 4px 8px; border-radius: 20px;
        }
        .sched-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .sched-exercises { display: flex; flex-direction: column; gap: 4px; }
        .sched-ex { font-size: 13px; color: var(--tx2); }
    </style>
</head>
<body>

    <header>
        <div class="logo">FitQuest</div>
        <!-- Пункт 2: Полные дата и время -->
        <div class="date-time" id="datetime">Загрузка...</div>
    </header>

    <aside>
        <button class="nav-btn active">Дашборд</button>
        <button class="nav-btn">Клиенты</button>
        <button class="nav-btn">Расписание</button>
        <button class="nav-btn">Проверки</button>
        <button class="nav-btn">Лавка</button>
        <button class="nav-btn">Настройки</button>
        <hr style="border: 0; border-top: 1px solid var(--line); margin: 10px 0;">
        <button class="nav-btn" onclick="document.body.classList.toggle('dark')">Тема</button>
    </aside>

    <main>
        <h1>Обзор</h1>
        
        <!-- Пункт 1 и 3: Динамические виджеты в скролл-контейнере -->
        <div class="bento-container" id="dashboard"></div>

        <div style="height: 20px;"></div>

        <!-- Пункт 4: Регулируемое расписание -->
        <div class="schedule-card">
            <h2 style="margin-bottom: 15px;">Расписание на сегодня</h2>
            <div id="schedule"></div>
        </div>
    </main>

    <script>
        // --- НАСТРОЙКИ (МЕНЯТЬ ЗДЕСЬ) ---
        
        // Пункт 1: Чтобы добавить виджет, просто скопируйте объект и поменяйте данные
        const dashboardTiles = [
            { title: "Клиенты", value: "124", icon: "👥" },
            { title: "Ждут проверки", value: "8", icon: "✅" },
            { title: "Отмены", value: "3", icon: "❌" },
            { title: "Выручка", value: "124 500 ₽", icon: "💰" },
            { title: "Новые заявки", value: "15", icon: "📩" },
            { title: "Активные абонементы", value: "89", icon: "🎫" }
        ];

        // Пункт 4: Чтобы изменить расписание, меняйте данные здесь
        const scheduleData = [
            {
                time: "10:00",
                type: "Групповое",
                title: "Пилатес (группа)",
                exercises: ["Суставная разминка", "Сотня", "Мост пилатес", "Поза ребенка"]
            },
            {
                time: "11:30",
                type: "Индивидуальное",
                title: "Анна Смирнова",
                exercises: ["Суставная разминка", "Приседания без веса", "Отжимания от пола", "Планка"]
            },
            {
                time: "13:00",
                type: "Групповое",
                title: "Функциональный тренинг",
                exercises: ["Берпи", "Тяга гантели", "Выпады", "Скакалка"]
            },
            {
                time: "15:00",
                type: "Индивидуальное",
                title: "Иван Петров",
                exercises: ["Разминка плеч", "Жим гантелей", "Тяга в наклоне", "Пресс"]
            }
        ];

        // --- ЛОГИКА ---

        // Пункт 2: Обновление даты и времени
        function updateDateTime() {
            const el = document.getElementById('datetime');
            const now = new Date();
            const options = { 
                weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            };
            el.textContent = now.toLocaleString('ru-RU', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Пункт 1: Рендер виджетов
        const dashContainer = document.getElementById('dashboard');
        dashboardTiles.forEach(tile => {
            const div = document.createElement('div');
            div.className = 'tile';
            div.innerHTML = `
                <div class="tile-icon">\${tile.icon}</div>
                <div class="tile-title">\${tile.title}</div>
                <div class="tile-value">\${tile.value}</div>
            `;
            dashContainer.appendChild(div);
        });

        // Пункт 4: Рендер расписания
        const schedContainer = document.getElementById('schedule');
        scheduleData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'schedule-item';
            
            let exList = '';
            item.exercises.forEach(ex => {
                exList += `<div class="sched-ex">• \${ex}</div>`;
            });

            div.innerHTML = `
                <div class="sched-header">
                    <div class="sched-time">\${item.time}</div>
                    <div class="sched-type">\${item.type}</div>
                </div>
                <div class="sched-title">\${item.title}</div>
                <div class="sched-exercises">
                    \${exList}
                </div>
            `;
            schedContainer.appendChild(div);
        });
    </script>
</body>
</html>
