<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>FitQuest — Тренер</title>
    <link rel="manifest" href='data:application/json,{"name":"FitQuest Тренер","short_name":"FitQuest","display":"standalone","start_url":"./trener.html","background_color":"%23f2f3f8","theme_color":"%230d9488"}'>
    <style>
        /* =========================================
           1. КОНФИГУРАЦИЯ СТИЛЕЙ (МЕНЯТЬ ЗДЕСЬ)
           ========================================= */
        :root {
            --c-primary: #0d9488;
            --c-primary-light: #14b8a6;
            --c-bg: #f2f3f8;
            --c-bg-card: #ffffff;
            --c-text: #171a26;
            --c-text-sec: #6a7086;
            --c-line: #e6e8f0;
            --sz-radius: 20px;
            --sz-gap: 16px;
            --sz-font-base: 15px;
            --sh: 0 10px 30px rgba(23,26,38,.08), 0 2px 8px rgba(23,26,38,.05);
        }

        body.dark {
            --c-bg: #0d1020;
            --c-bg-card: #181c34;
            --c-text: #eef0fa;
            --c-text-sec: #9aa0bd;
            --c-line: #252a48;
            --sh: 0 10px 30px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
        }

        /* =========================================
           2. БАЗОВЫЕ СТИЛИ
           ========================================= */
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            font-family:-apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif;
            background:var(--c-bg);
            color:var(--c-text);
            -webkit-font-smoothing:antialiased;
            position:relative;
            min-height:100vh;
            font-size:var(--sz-font-base);
        }
        body::before{
            content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
            background:radial-gradient(600px 300px at 15% -5%,rgba(13,148,136,.16),transparent 60%),
                       radial-gradient(500px 280px at 90% 10%,rgba(20,184,166,.12),transparent 60%);
        }
        main,header,nav{position:relative;z-index:1}

        /* =========================================
           3. ШАПКА И БОКОВОЕ МЕНЮ
           ========================================= */
        .hdr{
            position:sticky;top:0;z-index:50;
            background:color-mix(in srgb, var(--c-bg) 88%, transparent);
            backdrop-filter:blur(14px);
            border-bottom:1px solid var(--c-line);
        }
        .hdr-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .logo{font-size:20px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(90deg,var(--c-primary),var(--c-primary-light));-webkit-background-clip:text;background-clip:text;color:transparent}
        
        .side{
            position:fixed;top:74px;bottom:14px;left:14px;width:212px;z-index:60;
            display:flex;flex-direction:column;gap:4px;
            background:color-mix(in srgb, var(--c-bg-card) 88%, transparent);
            backdrop-filter:blur(16px);
            border:1px solid var(--c-line);
            border-radius:var(--sz-radius);
            padding:14px 10px;
            box-shadow:var(--sh);
        }
        .side .sbtn{
            background:none;border:none;color:var(--c-text-sec);
            font-size:13.5px;font-weight:700;
            display:flex;align-items:center;gap:10px;
            padding:11px 12px;cursor:pointer;
            border-radius:14px;text-align:left;width:100%;
            transition:color .2s, background .2s;
        }
        .side .sbtn:hover{color:var(--c-text)}
        .side .sbtn.on{
            color:#fff;background:linear-gradient(120deg,var(--c-primary),var(--c-primary-light));
            box-shadow:0 6px 16px rgba(13,148,136,.35);
        }
        .side .sbtn .cnt{
            margin-left:auto;font-size:11px;font-weight:800;color:#fff;
            background:var(--c-primary);border-radius:99px;padding:1px 7px;min-width:18px;text-align:center;
        }

        main{
            transition:padding-left .3s ease;
            max-width:1120px;margin:0 auto;
            padding:24px 24px 60px 258px;
        }

        @media(max-width:860px){
            .side{transform:translateX(calc(-100% - 30px));width:250px}
            body.sideopen .side{transform:none}
            main{padding:20px 16px 40px}
        }

        /* =========================================
           4. КОМПОНЕНТЫ
           ========================================= */
        .card{
            background:var(--c-bg-card);
            border:1px solid var(--c-line);
            border-radius:var(--sz-radius);
            box-shadow:var(--sh);
            padding:18px;
            position:relative;
            overflow:hidden;
            transition:transform .2s, box-shadow .2s;
        }
        .card:hover{transform:translateY(-2px)}
        
        h1.title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 18px}
        h2.sec{font-size:15px;font-weight:700;color:var(--c-text-sec);margin:26px 0 12px;text-transform:uppercase;letter-spacing:.6px}

        .btn{
            display:inline-flex;align-items:center;gap:8px;
            background:linear-gradient(120deg,var(--c-primary),var(--c-primary-light));
            color:#fff;border:none;border-radius:14px;
            padding:11px 18px;font-size:14px;font-weight:700;
            cursor:pointer;box-shadow:0 6px 18px rgba(13,148,136,.35);
            transition:transform .15s;
        }
        .btn:active{transform:scale(.97)}
        .btn.ghost{background:var(--c-bg-card);color:var(--c-text);box-shadow:none;border:1px solid var(--c-line)}
        .btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}

        .list{display:flex;flex-direction:column;gap:12px}
        .item{
            background:var(--c-bg-card);border:1px solid var(--c-line);
            border-radius:16px;padding:14px 16px;
            display:flex;align-items:center;gap:12px;
            cursor:pointer;transition:transform .15s;box-shadow:var(--sh);
        }
        .item:hover{transform:translateY(-2px)}
        .av{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}

        /* =========================================
           5. КАЛЕНДАРЬ
           ========================================= */
        .calcard{max-width:380px;min-width:0}
        .calrow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
        .calrow .daycol{flex:1;min-width:280px}
        
        .cal{
            display:grid;
            grid-template-columns:repeat(7, minmax(0, 44px));
            gap:3px;
        }
        .cal .cw{
            text-align:center;font-size:10px;color:var(--c-text-sec);
            font-weight:700;padding:2px 0;
        }
        .cal .cd{
            height:32px;
            border-radius:9px;
            border:1.5px solid var(--c-line);
            background:var(--c-bg-card);
            display:flex;align-items:center;justify-content:center;
            cursor:pointer;font-weight:700;font-size:12px;
            position:relative;transition:border-color .15s;
        }
        .cal .cd:hover{border-color:var(--c-primary)}
        .cal .cd.today{border-color:var(--c-primary);color:var(--c-primary)}
        .cal .cd.sel{
            background:linear-gradient(120deg,var(--c-primary),var(--c-primary-light));
            color:#fff;border-color:transparent;
        }
        .cal .cd .dot{
            position:absolute;bottom:3px;width:4px;height:4px;
            border-radius:50%;background:var(--c-primary);
        }
        .cal .cd.sel .dot{background:#fff}

        /* =========================================
           6. МОДАЛКИ И УВЕДОМЛЕНИЯ
           ========================================= */
        .modal{position:fixed;inset:0;z-index:100;background:rgba(10,12,24,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
        @media(min-width:700px){.modal{align-items:center}}
        .modal.open{display:flex}
        .mcard{
            background:var(--c-bg-card);width:100%;max-width:560px;max-height:88vh;
            overflow:auto;border-radius:24px 24px 0 0;padding:22px;
        }
        @media(min-width:700px){.mcard{border-radius:24px}}
        
        .toast{
            position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
            background:var(--c-text);color:var(--c-bg-card);padding:11px 20px;
            border-radius:999px;font-size:14px;font-weight:600;opacity:0;
            pointer-events:none;transition:.3s;z-index:200;
        }
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

        .errbox{
            display:none;position:fixed;top:0;left:0;right:0;z-index:999;
            background:#dc2626;color:#fff;padding:12px 16px;font:13px/1.4 monospace;
            white-space:pre-wrap;
        }

        /* Стили для библиотеки упражнений */
        .lib-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap:12px;
        }
        .lib-item{
            background:var(--c-bg-card);
            border:1px solid var(--c-line);
            border-radius:14px;
            padding:12px;
            text-align:center;
            cursor:pointer;
            transition:all .2s;
        }
        .lib-item:hover{
            transform:translateY(-2px);
            border-color:var(--c-primary);
            box-shadow:var(--sh);
        }
        .lib-item.selected{
            background:linear-gradient(120deg, var(--c-primary), var(--c-primary-light));
            color:#fff;
            border-color:transparent;
        }
        .lib-item img{
            width:48px;height:48px;object-fit:contain;margin-bottom:8px;
            filter:drop-shadow(0 4px 6px rgba(0,0,0,.1));
        }
        .lib-item span{
            font-size:13px;
            font-weight:600;
            display:block;
        }
    </style>
</head>
<body>
    <div id="errbox" class="errbox"></div>
    
    <header class="hdr">
        <div class="hdr-in">
            <div class="logo">FitQuest</div>
            <div class="hbtn">
                <button id="bellBtn" style="display:none; width:42px; justify-content:center; padding:11px 0;">
                    <svg class="ico" viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2z"/><path d="M18.5 14A6.5 6.5 0 0 0 5.5 14c0 3.54 2.88 6.41 6.41 6.5.06.23.12.46.19.68h2.8c.07-.22.13-.45.19-.68C15.62 20.41 18.5 17.54 18.5 14z"/><path d="M15.5 4.5a2 2 0 1 1-4 0V3a2 2 0 0 1 4 1.5z"/></svg>
                    <span id="nbadge" style="position:absolute;top:-6px;right:-6px;padding:1px 7px;font-size:11px;min-width:18px;text-align:center;background:var(--c-primary);color:#fff;border-radius:99px;">0</span>
                </button>
            </div>
        </div>
    </header>

    <aside class="side">
        <button class="sbtn" data-act="nav" data-to="profile">
            <span class="ic">Профиль</span>
        </button>
        <button class="sbtn" data-act="nav" data-to="quests">
            <span class="ic">Квесты</span>
        </button>
        <button class="sbtn" data-act="nav" data-to="meas">
            <span class="ic">Замеры</span>
        </button>
        <button class="sbtn on" data-act="nav" data-to="trener">
            <span class="ic">Тренер</span>
            <span class="cnt">1</span>
        </button>
        <button class="sbtn" data-act="nav" data-to="chat">
            <span class="ic">Чаты</span>
        </button>
        <div class="sp">
            <button class="sbtn" data-act="logout">
                <span class="ic">Выход</span>
            </button>
        </div>
    </aside>

    <main id="app">
        <!-- Контент будет загружен JS -->
    </main>

    <div id="scrim" style="position:fixed;inset:0;background:rgba(10,12,24,.45);z-index:55;display:none"></div>
    
    <!-- Модальное окно добавления занятия -->
    <div class="modal" id="modal">
        <div class="mcard">
            <div style="padding:10px 0;border-bottom:1px solid var(--c-line);margin-bottom:10px;">
                <h2 style="margin:0;font-size:18px;">Новое занятие</h2>
            </div>
            <div style="margin-bottom:15px;">
                <label style="display:block;margin-bottom:6px;color:var(--c-text-sec);font-size:13px">Упражнение</label>
                <select id="sessLib" class="inp" style="width:100%;padding:10px;border:1px solid var(--c-line);border-radius:12px;font-size:14px;background:var(--c-bg-card);color:var(--c-text);">
                    <!-- Опции будут добавлены JS -->
                </select>
            </div>
            <div style="margin-bottom:15px;">
                <label style="display:block;margin-bottom:6px;color:var(--c-text-sec);font-size:13px">Количество повторов</label>
                <input type="number" id="sessReps" class="inp" placeholder="Например: 15" style="width:100%;padding:10px;border:1px solid var(--c-line);border-radius:12px;font-size:14px;background:var(--c-bg-card);color:var(--c-text);">
            </div>
            <div style="margin-top:15px;display:flex;justify-content:flex-end;gap:10px;">
                <button class="btn ghost" onclick="closeModal()">Отмена</button>
                <button class="btn" onclick="saveSession()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* =========================================
           ГЛАВНАЯ КОНФИГУРАЦИЯ И БАЗА ДАННЫХ (DB)
           Это имитация сервера. Здесь хранятся ВСЕ данные.
           ========================================= */
        const DB = {
            user: {name: 'Тренер Иван', id: 101},
            
            // Библиотека упражнений (Глобальный список)
            library: [
                {id: 1, name: 'Приседания', img: '🦵', desc: 'Базовое упражнение для ног'},
                {id: 2, name: 'Отжимания', img: '💪', desc: 'Для грудных мышц и трицепса'},
                {id: 3, name: 'Планка', img: '🧘', desc: 'Статическое упражнение на корпус'},
                {id: 4, name: 'Выпады', img: '🏃', desc: 'Изолированная работа над бедрами'},
                {id: 5, name: 'Подтягивания', img: '🏋️', desc: 'Для спины и бицепса'},
                {id: 6, name: 'Скручивания', img: '🌀', desc: 'Для пресса'},
                {id: 7, name: 'Махи гантелями', img: '🏋️‍♀️', desc: 'Для дельтовидных мышц'},
                {id: 8, name: 'Становая тяга', img: '🏋️‍♂️', desc: 'Базовое многосуставное упражнение'},
                {id: 9, name: 'Гиперэкстензия', img: '🤸', desc: 'Для разгибателей спины'},
                {id: 10, name: 'Прыжки на скакалке', img: '🤸‍♀️', desc: 'Кардио нагрузка'},
                {id: 11, name: 'Берпи', img: '🔥', desc: 'Интенсивное функциональное упражнение'},
                {id: 12, name: 'Тяга штанги в наклоне', img: '🏋️', desc: 'Для широчайших мышц спины'},
                {id: 13, name: 'Жим гантелей лежа', img: '🏋️', desc: 'Для грудных мышц'},
                {id: 14, name: 'Разведение ног в тренажере', img: '🦵', desc: 'Для ягодиц'},
                {id: 15, name: 'Вакуум живота', img: '🌙', desc: 'Для поперечной мышцы живота'}
            ],

            // Активные сессии (Расписание) - ДЕМО ДАННЫЕ ДЛЯ ТЕСТА
            sessions: [
                {id: 1001, libId: 1, name: 'Приседания', reps: 30, date: 0, time: Date.now()},
                {id: 1002, libId: 2, name: 'Отжимания', reps: 20, date: 0, time: Date.now() + 3600000},
                {id: 1003, libId: 3, name: 'Планка', reps: 1, date: 1, time: Date.now() + 86400000}, // Завтра
                {id: 1004, libId: 5, name: 'Подтягивания', reps: 10, date: 1, time: Date.now() + 90000000}
            ],
            
            calM: 0, // Смещение месяца
            calSel: null // Выбранный день
        };

        /* =========================================
           ПОМОЩНИКИ
           ========================================= */
        function today0() {
            const d = new Date();
            d.setHours(0,0,0,0);
            return d;
        }

        function dateFromOff(off) {
            const d = today0();
            d.setDate(d.getDate() + off);
            return d;
        }

        function iso(d) {
            return d.toISOString().split('T');
        }

        function fmt(d) {
            return d.toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'});
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            if(!t) return;
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function err(msg) {
            const e = document.getElementById('errbox');
            if(!e) return;
            e.innerText = msg;
            e.style.display = 'block';
            setTimeout(() => e.style.display = 'none', 5000);
        }

        /* =========================================
           ОТРИСОВКА ИНТЕРФЕЙСА
           ========================================= */

        // Рендер календаря
        function rCal() {
            const sel = (DB.calSel === null ? 0 : +DB.calSel);
            const base = today0();
            const cur = new Date(base.getFullYear(), base.getMonth() + (DB.calM || 0), 1);
            const y = cur.getFullYear(), m = cur.getMonth();
            const label = cur.toLocaleString('ru-RU', {month:'long', year:'numeric'});
            const lead = (new Date(y, m, 1).getDay() + 6) % 7;
            const dim = new Date(y, m + 1, 0).getDate();

            let h = '<h1 class="title">Расписание тренировок</h1>';
            h += '<div class="row" style="margin:18px 0 8px">';
            h += '<button class="btn" data-act="addsess">+ Добавить занятие</button>';
            h += '<button class="btn ghost" data-act="lib">Библиотека упражнений</button>';
            h += '</div>';
            
            h += '<div class="tabbar">';
            h += '<button class="on" data-act="caltab" data-m="cal">Календарь</button>';
            h += '<button data-act="caltab" data-m="list">Все дни</button>';
            h += '</div>';

            /* Календарь */
            let cal = '<div class="card calcard">';
            cal += '<div class="row" style="justify-content:space-between;margin-bottom:8px">';
            cal += '<button class="btn ghost sm" data-act="calmv" data-d="-1">←</button>';
            cal += '<b style="text-transform:capitalize;font-size:14px">' + label + '</b>';
            cal += '<button class="btn ghost sm" data-act="calmv" data-d="1">→</button>';
            cal += '</div>';
            
            cal += '<div class="cal">';
            ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w => {
                cal += '<div class="cw">' + w + '</div>';
            });
            for(let i=0; i<lead; i++) cal += '<div></div>';
            
            for(let d=1; d<=dim; d++) {
                const dt = new Date(y, m, d);
                const off = Math.round((dt - base) / 86400000);
                const cnt = DB.sessions.filter(s => s.date === off).length;
                const classes = (off === 0 ? ' today' : '') + (off === sel ? ' sel' : '');
                cal += '<div class="cd' + classes + '" data-act="calday" data-off="' + off + '">' + d;
                if(cnt) cal += '<span class="dot"></span>';
                cal += '</div>';
            }
            cal += '</div></div>';

            document.getElementById('app').innerHTML = cal;
            attachEvents();
        }

        // Рендер списка всех занятий
        function rList() {
            let h = '<h1 class="title">Все тренировки</h1>';
            h += '<div class="row" style="margin:18px 0 8px">';
            h += '<button class="btn" data-act="addsess">+ Добавить занятие</button>';
            h += '<button class="btn ghost" data-act="nav" data-to="trener">Назад к календарю</button>';
            h += '</div>';

            const byDay = {};
            DB.sessions.forEach(s => {
                if(!byDay[s.date]) byDay[s.date] = ;
                byDay[s.date].push(s);
            });

            const days = Object.keys(byDay).sort((a,b) => b-a);
            days.forEach(d => {
                const dt = dateFromOff(+d);
                h += '<div class="card"><h2 class="sec">' + fmt(dt) + '</h2><div class="list">';
                byDay[d].forEach(s => {
                    const ex = DB.library.find(l => l.id === s.libId) || {name: 'Неизвестно'};
                    h += '<div class="item">';
                    h += '<div class="av" style="background:var(--c-primary)">' + ex.img + '</div>';
                    h += '<div><div style="font-weight:700">' + ex.name + '</div>';
                    h += '<div style="color:var(--c-text-sec);font-size:13px">' + s.reps + ' повторов</div></div>';
                    h += '<div style="margin-left:auto;color:var(--c-text-sec);font-size:13px">' + new Date(s.time).toLocaleTimeString(, {hour:'2-digit',minute:'2-digit'}) + '</div>';
                    h += '</div>';
                });
                h += '</div></div>';
            });

            if(days.length === 0) h += '<div style="padding:40px;text-align:center;color:var(--c-text-sec)">Пока нет тренировок</div>';

            document.getElementById('app').innerHTML = h;
            attachEvents();
        }

        // Рендер библиотеки
        function rLib() {
            let h = '<h1 class="title">Библиотека упражнений</h1>';
            h += '<div class="row" style="margin:18px 0 8px">';
            h += '<button class="btn ghost" data-act="nav" data-to="trener">Назад к календарю</button>';
            h += '</div>';
            h += '<div class="lib-grid">';
            DB.library.forEach(l => {
                h += '<div class="lib-item" data-id="' + l.id + '">';
                h += '<span>' + l.img + '</span>';
                h += '<span>' + l.name + '</span>';
                h += '</div>';
            });
            h += '</div>';
            document.getElementById('app').innerHTML = h;
            attachEvents();
        }

        /* =========================================
           МОДАЛЬНЫЕ ОКНА И ДЕЙСТВИЯ
           ========================================= */
        function openModal() {
            document.getElementById('modal').classList.add('open');
            document.getElementById('scrim').style.display = 'block';
            const sel = document.getElementById('sessLib');
            sel.innerHTML = '';
            DB.library.forEach(l => {
                sel.innerHTML += '<option value="' + l.id + '">' + l.name + '</option>';
            });
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            document.getElementById('scrim').style.display = 'none';
            document.getElementById('sessReps').value = '';
        }

        function saveSession() {
            const libId = +document.getElementById('sessLib').value;
            const reps = +document.getElementById('sessReps').value;
            if(!libId || !reps) return toast('Заполните все поля');
            
            const ex = DB.library.find(l => l.id === libId);
            DB.sessions.push({
                id: Date.now(),
                libId: libId,
                name: ex.name,
                reps: reps,
                date: DB.calSel || 0,
                time: Date.now()
            });
            toast('Занятие добавлено!');
            closeModal();
            rCal();
        }

        /* =========================================
           НАВИГАЦИЯ И СОБЫТИЯ
           ========================================= */
        function nav(to) {
            // Здесь можно добавить логику переключения вкладок (профиль, квесты и т.д.)
            // Для простоты пока просто очищаем контент или показываем заглушку
            if(to === 'trener') rCal();
            else document.getElementById('app').innerHTML = '<h1 class="title">Раздел "' + to + '" в разработке</h1>';
        }

        function calMv(d) {
            DB.calM += +d;
            rCal();
        }

        function calDay(off) {
            DB.calSel = +off;
            rCal();
        }

        function calTab(mode) {
            if(mode === 'cal') rCal();
            else rList();
        }

        function attachEvents() {
            document.querySelectorAll('[data-act]').forEach(el => {
                el.addEventListener('click', (e) => {
                    const act = e.target.getAttribute('data-act');
                    const val = e.target.getAttribute('data-val');
                    const to = e.target.getAttribute('data-to');
                    const d = e.target.getAttribute('data-d');
                    const off = e.target.getAttribute('data-off');
                    
                    if(act === 'nav') nav(to);
                    if(act === 'addsess') openModal();
                    if(act === 'lib') rLib();
                    if(act === 'calmv') calMv(d);
                    if(act === 'calday') calDay(off);
                    if(act === 'caltab') calTab(val);
                    if(act === 'logout') {
                        localStorage.removeItem('fit_user');
                        location.href = './index.html';
                    }
                });
            });

            // Обработка выбора упражнения в библиотеке
            document.querySelectorAll('.lib-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const id = +el.getAttribute('data-id');
                    const ex = DB.library.find(l => l.id === id);
                    toast('Выбрано: ' + ex.name);
                    // Можно добавить логику добавления в избранное или в тренировку
                });
            });
        }

        /* =========================================
           ИНИЦИАЛИЗАЦИЯ
           ========================================= */
        function init() {
            // Проверка авторизации (заглушка)
            const user = localStorage.getItem('fit_user') || JSON.stringify(DB.user);
            localStorage.setItem('fit_user', user);
            
            // Запуск календаря
            rCal();
        }

        // Запуск приложения
        init();
    </script>
</body>
</html>
