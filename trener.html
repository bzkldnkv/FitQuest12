<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FitQuest — Тренер</title>
<link rel="manifest" href='data:application/json,{"name":"FitQuest Тренер","short_name":"FitQuest","display":"standalone","start_url":"./trener.html","background_color":"%23171a26","theme_color":"%235b5bf0"}'>
<style>
:root{--bg:#f2f3f8;--bg2:#ffffff;--tx:#171a26;--tx2:#6a7086;--line:#e6e8f0;--card:#ffffff;--acc:#5b5bf0;--acc2:#8b5cf6;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--rad:20px;--sh:0 10px 30px rgba(23,26,38,.08),0 2px 8px rgba(23,26,38,.05)}
body.dark{--bg:#0d1020;--bg2:#141830;--tx:#eef0fa;--tx2:#9aa0bd;--line:#252a48;--card:#181c34;--sh:0 10px 30px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px 300px at 15% -5%,rgba(91,91,240,.16),transparent 60%),radial-gradient(500px 280px at 90% 10%,rgba(139,92,246,.12),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(91,91,240,.10),transparent 60%)}
main,header,nav{position:relative;z-index:1}
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hbtn{display:flex;gap:8px;align-items:center}
main{max-width:1040px;margin:0 auto;padding:24px 20px 120px}
h1.title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 18px}
h2.sec{font-size:15px;font-weight:700;color:var(--tx2);margin:26px 0 12px;text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:18px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.bento{grid-template-columns:1fr 1fr}}
.tile{padding:18px;position:relative}
.tile::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;right:-40px;top:-40px;background:linear-gradient(135deg,rgba(91,91,240,.14),rgba(139,92,246,.05))}
.tile .lbl{font-size:13px;color:var(--tx2);font-weight:600}
.tile .val{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:6px}
.tile.hero{grid-column:1/-1;background:linear-gradient(120deg,#5b5bf0,#8b5cf6);color:#fff;border:none}
.tile.hero::after{background:rgba(255,255,255,.14)}
.tile.hero .lbl{color:rgba(255,255,255,.8)}
.cap{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:8px}
.cap.up{background:rgba(22,163,74,.12);color:var(--ok)}
.cap.down{background:rgba(220,38,38,.12);color:var(--bad)}
.cap.warn{background:rgba(217,119,6,.14);color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:14px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(91,91,240,.35);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:rgba(220,38,38,.1);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inp{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--tx);outline:none;transition:border .2s}
.inp:focus{border-color:var(--acc)}
label.fl{display:block;font-size:13px;color:var(--tx2);font-weight:600;margin:12px 0 6px}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s;box-shadow:var(--sh)}
.item:hover{transform:translateY(-2px)}
.av{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.ring{width:40px;height:40px;flex-shrink:0}
.ring circle.bg{stroke:var(--line)}
.ring circle.fg{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset .6s}
.nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:var(--sh)}
.nav button{background:none;border:none;color:var(--tx2);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;border-radius:14px;flex:1}
.nav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.nav .ic{font-size:19px;line-height:1}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,12,24,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.modal.open{display:flex}
.mcard{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px;animation:up .25s ease}
@media(min-width:700px){.mcard{border-radius:24px;animation:pop .2s ease}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.errbox{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#dc2626;color:#fff;padding:12px 16px;font:13px/1.4 monospace;white-space:pre-wrap}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bars .b{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));margin-top:6px;transition:width .5s}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.tgl{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);cursor:pointer;transition:.2s;flex-shrink:0;border:none}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tgl.on{background:var(--ok)}
.tgl.on::after{left:23px}
.tabbar{display:flex;gap:8px;margin:14px 0}
.tabbar button{background:var(--bg2);border:1.5px solid var(--line);color:var(--tx2);padding:8px 16px;border-radius:99px;font-size:13.5px;font-weight:700;cursor:pointer}
.tabbar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.pill.red{background:rgba(220,38,38,.12);color:var(--bad)}
.pill.green{background:rgba(22,163,74,.12);color:var(--ok)}
.pill.blue{background:rgba(91,91,240,.12);color:var(--acc)}
.pill.gray{background:var(--line);color:var(--tx2)}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;margin:4px 0}
.msg.me{background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.msg.them{background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:5px}
.empty{text-align:center;color:var(--tx2);padding:30px 10px;font-size:14px}
.chart{width:100%;height:120px}
</style></head>
<body>
<div id="errbox" class="errbox"></div>
<header class="hdr"><div class="hdr-in">
<div class="logo">Fit<span style="font-weight:400">Quest</span></div>
<div class="hbtn"><button class="btn ghost sm" id="themeBtn" data-act="theme">🌙</button></div>
</div></header>
<main id="app" class="fade"></main>
<nav class="nav" id="nav"></nav>
<div class="modal" id="modal" data-act="closemodal"><div class="mcard" id="mcard"></div></div>
<div class="toast" id="toast"></div>
<script>
window.addEventListener('error',function(e){var b=document.getElementById('errbox');b.style.display='block';b.textContent='Ошибка скрипта: '+e.message+' (строка '+e.lineno+')';});
var KEY='fitquest_v3';
function demo(){return{auth:false,theme:'auto',invite:'FIT-7K2Q',tariffs:[{n:'Индивидуальная',p:2500},{n:'Онлайн',p:1800},{n:'Пилатес группа',p:1900}],
clients:[
{id:'c1',name:'Анна Смирнова',login:'anna',pass:'1234',emoji:'🐰',c:'#f59e0b',xp:420,streak:5,blockDay:5,blockLen:21,disc:10,lastActive:2,sub:{left:6,total:12,frozen:false},notes:'Любит утренние тренировки',tags:['пилатес','спина'],quests:[{n:'Блок «Спина и осанка»',d:5,t:21},{n:'Привычка: 8000 шагов',d:12,t:30}],measures:[{d:'01.10',w:62.5},{d:'08.10',w:62.1},{d:'15.10',w:61.4},{d:'22.10',w:60.9},{d:'29.10',w:60.2}],chat:[{who:'them',t:'Готова к отчёту за завтра!'}],report:{quest:'Пилатес и укрепление спины',date:'сегодня',text:'Выполнила всю программу, спина не болит'}},
{id:'c2',name:'Иван Петров',login:'ivan',pass:'1234',emoji:'🐻',c:'#3b82f6',xp:150,streak:0,blockDay:2,blockLen:21,disc:0,lastActive:7,sub:{left:2,total:8,frozen:false},notes:'Нужно вернуть к тренировкам',tags:['новичок'],quests:[{n:'Блок «База: всё тело»',d:2,t:21}],measures:[{d:'20.10',w:84.0},{d:'27.10',w:83.2}],chat:[],report:null}],
sessions:[{id:'s1',date:0,time:'10:00',title:'Пилатес (группа)',price:1900,type:'group',who:['c1'],paid:['c1']},{id:'s2',date:0,time:'18:30',title:'Индивидуальная',price:2500,type:'indiv',who:['c2'],paid:[]},{id:'s3',date:1,time:'09:00',title:'Онлайн',price:1800,type:'online',who:['c1'],paid:[]}],
rewards:[{n:'Скидка 10% на месяц',cost:300},{n:'Гостевой визит для друга',cost:500},{n:'Фитнес-марафон бесплатно',cost:1000}],purchases:[]};}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return demo();}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2200);}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d;}
function fmt(d){return d.getDate()+' '+['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];}
function monthName(i){return ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'][i];}
var VIEW='dash',TABS={dash:'🏠|Дашборд',clients:'👥|Клиенты',schedule:',📅|Расписание'checks:'✅|Проверки',shop:'🎁|Лавка',settings:'⚙️|Настройки'};
function clientById(id){for(var i=0;i<S.clients.length;i++)if(S.clients[i].id===id)return S.clients[i];return null;}
function ring(pct){pct=Math.max(0,Math.min(100,pct));var r=16,c=2*Math.PI*r;return '<svg class="ring" viewBox="0 0 40 40"><defs><linearGradient id="grad"><stop offset="0%" stop-color="#5b5bf0"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs><circle class="bg" cx="20" cy="20" r="'+r+'" fill="none" stroke-width="4"/><circle class="fg" cx="20" cy="20" r="'+r+'" fill="none" stroke-width="4" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c-c*pct/100)+'" transform="rotate(-90 20 20)"/><text x="20" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">'+pct+'%</text></svg>';}
function applyTheme(){var t=S.theme;if(t==='auto'){t=(new Date().getHours()>=20||new Date().getHours()<8)?'dark':'light';}document.body.classList.toggle('dark',t==='dark');var b=document.getElementById('themeBtn');if(b)b.textContent=t==='dark'?'☀️':'🌙';}
function setTheme(){S.theme=document.body.classList.contains('dark')?'light':'dark';save();applyTheme();}
function renderNav(){var n=document.getElementById('nav');var h='';for(var k in TABS){var p=TABS[k].split('|');h+='<button data-act="nav" data-v="'+k+'" class="'+(VIEW===k?'on':'')+'"><span class="ic">'+p[0]+'</span>'+p[1]+'</button>';}n.innerHTML=h;}
function go(v){VIEW=v;renderNav();render();}
function render(){var a=document.getElementById('app');a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade');var f={dash:rDash,clients:rClients,schedule:rSchedule,checks:rChecks,shop:rShop,settings:rSettings}[VIEW];a.innerHTML=f?f():'';}
function modal(html){document.getElementById('mcard').innerHTML=html;document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
var checks=S.clients.filter(function(c){return c.report;}).length;
var risk=S.clients.filter(function(c){return c.lastActive>=7;});
var top=S.clients.slice().sort(function(a,b){return b.xp-a.xp;}).slice(0,3);
var h='<h1 class="title">Дашборд</h1><div class="bento">'
+'<div class="card tile"><div class="lbl">Клиенты</div><div class="val">'+S.clients.length+'</div></div>'
+'<div class="card tile"><div class="lbl">Ждут проверки</div><div class="val">'+checks+'</div></div>'
+'<div class="card" style="grid-column:1/-1"><b>Риск отвала</b>';
if(!risk.length)h+='<div class="empty">Все клиенты на связи 👌</div>';
risk.forEach(function(c){h+='<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>'+c.emoji+' <b>'+esc(c.name)+'</b></span><span class="cap down">▼ '+c.lastActive+' дн. тишины</span></div>';});
h+='</div><div class="card" style="grid-column:1/-1"><b>Топ по XP</b>';
top.forEach(function(c,i){h+='<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>'+(i+1)+'. '+c.emoji+' '+esc(c.name)+'</span><b>'+c.xp+' XP</b></div>';});
return h+'</div></div>';}
function fmtMoney(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽';}
function rClients(){var h='<h1 class="title">Клиенты</h1><div class="row" style="margin-bottom:14px"><button class="btn" data-act="addclient">＋ Добавить клиента</button></div><div class="list">';
S.clients.forEach(function(c){var pct=Math.round(c.blockDay/c.blockLen*100);
h+='<div class="item" data-act="client" data-id="'+c.id+'"><div class="av" style="background:'+c.c+'">'+c.emoji+'</div><div style="flex:1;min-width:0"><b>'+esc(c.name)+'</b><div style="font-size:12.5px;color:var(--tx2)">Ур.'+Math.floor(c.xp/100+1)+' · '+c.xp+' XP · серия '+c.streak+' 🔥</div></div><div class="row" style="gap:8px">'+(c.lastActive>=7?'<span class="pill red">риск</span>':'')+ring(pct)+'</div></div>';});
return h+'</div>';}
function openClient(id){var c=clientById(id);if(!c)return;window._cid=id;clientTab('profile');}
function clientTab(t){window._ctab=t;var c=clientById(window._cid);if(!c)return;var h='<div class="row" style="justify-content:space-between"><b style="font-size:18px">'+c.emoji+' '+esc(c.name)+'</b><button class="btn ghost sm" data-act="closemodal2">✕</button></div><div class="tabbar">'+['profile|Профиль','quests|Квесты','meas|Замеры','chat|Чат'].map(function(x){var p=x.split('|');return '<button class="'+(t===p[0]?'on':'')+'" data-act="ctab" data-t="'+p[0]+'">'+p[1]+'</button>';}).join('')+'</div>';
if(t==='profile'){h+='<label class="fl">Заметки</label><div class="inp" contenteditable style="min-height:60px" id="cnotes">'+esc(c.notes)+'</div><label class="fl">Теги (через запятую)</label><input class="inp" id="ctags" value="'+esc(c.tags.join(', '))+'"><div class="row" style="margin-top:14px"><button class="btn sm" data-act="cnotesSave">Сохранить</button><button class="btn sm danger" data-act="delclient">Удалить клиента</button></div>';}
if(t==='quests'){c.quests.forEach(function(q,i){h+='<div class="card" style="margin-top:12px;box-shadow:none"><div class="row" style="justify-content:space-between"><b>'+esc(q.n)+'</b><button class="btn ghost sm" data-act="delquest" data-i="'+i+'">✕</button></div><div class="track" style="margin-top:10px"><div class="bars" style="width:'+Math.round(q.d/q.t*100)+'%"></div></div><div style="font-size:12.5px;color:var(--tx2);margin-top:6px">'+q.d+' из '+q.t+' дней</div></div>';});h+='<button class="btn sm" style="margin-top:12px" data-act="addquest">＋ Добавить квест</button>';}
if(t==='meas'){h+='<canvas class="chart" id="wchart"></canvas><div class="row" style="margin-top:10px"><input class="inp" id="mw" type="number" step="0.1" placeholder="Вес, кг" style="flex:1"><button class="btn sm" data-act="addmeas">＋</button></div>';}
if(t==='chat'){h+='<div style="max-height:300px;overflow:auto" id="chatbox">';(c.chat||[]).forEach(function(m){h+='<div class="msg '+(m.who==='me'?'me':'them')+'">'+esc(m.t)+'</div>';});if(!(c.chat||[]).length)h+='<div class="empty">Сообщений пока нет</div>';h+='</div><div class="row" style="margin-top:10px"><input class="inp" id="cmsg" placeholder="Сообщение…" style="flex:1" onkeydown="if(event.key===&apos;Enter&apos;)sendMsg()"><button class="btn sm" data-act="sendmsg">➤</button></div>';}
modal(h);if(t==='meas')drawChart(c);}
function drawChart(c){var cv=document.getElementById('wchart');if(!cv)return;var d=c.measures;if(d.length<2){var g=cv.getContext('2d');g.font='13px sans-serif';g.fillStyle=getComputedStyle(document.body).getPropertyValue('--tx2');g.fillText('Добавьте минимум 2 замера',10,60);return;}
var ws=d.map(function(m){return m.w;});var mn=Math.min.apply(null,ws)-1,mx=Math.max.apply(null,ws)+1;var g=cv.getContext('2d'),W=cv.width=cv.offsetWidth*2,H=cv.height=240;g.scale(1,1);g.clearRect(0,0,W,H);var pts=d.map(function(m,i){return [40+i*(W-60)/(d.length-1),H-30-(m.w-mn)/(mx-mn)*(H-60)];});
g.strokeStyle='#5b5bf0';g.lineWidth=5;g.lineJoin='round';g.beginPath();pts.forEach(function(p,i){i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);});g.stroke();
pts.forEach(function(p){g.beginPath();g.arc(p[0],p[1],7,0,7);g.fillStyle='#8b5cf6';g.fill();});}
function sendMsg(){var c=clientById(window._cid),el=document.getElementById('cmsg');if(!c||!el.value.trim())return;c.chat=(c.chat||[]);c.chat.push({who:'me',t:el.value.trim()});el.value='';save();clientTab('chat');var b=document.getElementById('chatbox');b.scrollTop=b.scrollHeight;}
function rSchedule(){var h='<h1 class="title">Расписание</h1><div class="row" style="margin-bottom:14px"><button class="btn" data-act="addsess">＋ Занятие</button></div><div class="list">';
var days={};S.sessions.forEach(function(s){(days[s.date]=days[s.date]||[]).push(s);});
var keys=Object.keys(days).map(Number).sort(function(a,b){return a-b;});
keys.forEach(function(off){var d=new Date(today0());d.setDate(d.getDate()+off);
h+='<h2 class="sec">'+(off===0?'Сегодня':off===1?'Завтра':fmt(d))+'</h2>';
days[off].forEach(function(s){h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(s.title)+'</b><span class="pill blue">'+s.time+'</span></div><div style="font-size:13px;color:var(--tx2);margin:6px 0">(s.type==='group'?'групповое':s.type==='indiv'?'индивидуальное':'онлайн')+'</div>';
s.who.forEach(function(cid){var cc=clientById(cid);if(!cc)return;h+='<div class="row" style="justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)"><span>'+cc.emoji+' '+esc(cc.name)+'</span><div class="row"><span style="font-size:12px;color:var(--tx2)">'+(s.paid.indexOf(cid)>=0?</div></div>';});
h+='<button class="btn ghost sm" style="margin-top:8px" data-act="delsess" data-id="'+s.id+'">Удалить</button></div>';});});
return h+'</div>';}
function rChecks(){var h='<h1 class="title">Проверки</h1><div class="list">';var n=0;
S.clients.forEach(function(c){if(!c.report)return;n++;h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+c.emoji+' '+esc(c.name)+'</b><span class="pill gray">'+esc(c.report.date)+'</span></div><div style="margin:8px 0;font-size:14px"><span class="pill blue">'+esc(c.report.quest)+'</span></div><p style="font-size:14px;color:var(--tx2)">'+esc(c.report.text)+'</p><div class="row" style="margin-top:12px"><button class="btn sm" data-act="approve" data-id="'+c.id+'">✔ Засчитать (+50 XP)</button><button class="btn sm danger" data-act="reject" data-id="'+c.id+'">Отклонить</button></div></div>';});
if(!n)h+='<div class="empty">Все отчёты обработаны 🎉</div>';
return h+'</div>';}
function rShop(){var h='<h1 class="title">Лавка наград</h1><div class="row" style="margin-bottom:14px"><button class="btn" data-act="addreward">＋ Награда</button></div><div class="list">';
S.rewards.forEach(function(r,i){h+='<div class="card" style="display:flex;align-items:center;gap:12px"><div style="flex:1"><b>'+esc(r.n)+'</b><div style="font-size:12.5px;color:var(--tx2)">Цена: '+r.cost+' XP</div></div><button class="btn ghost sm" data-act="delreward" data-i="'+i+'">✕</button></div>';});
if(!S.rewards.length)h+='<div class="empty">Добавьте первые награды</div>';
if(S.purchases.length){h+='<h2 class="sec">Заявки на покупку</h2>';
S.purchases.forEach(function(p,i){var c=clientById(p.cid);h+='<div class="card"><div class="row" style="justify-content:space-between"><span>'+esc(c?c.name:'')+' → <b>'+esc(p.n)+'</b></span><button class="btn sm" data-act="okpurchase" data-i="'+i+'">Выдать</button></div></div>';});}
return h+'</div>';}
function rSettings(){var h='<h1 class="title">Настройки</h1><div class="card"><b>Код приглашения</b><div class="row" style="margin-top:10px"><span class="pill blue" style="font-size:15px">'+S.invite+'</span><button class="btn ghost sm" data-act="copycode">Скопировать</button></div><p style="font-size:13px;color:var(--tx2);margin-top:10px">Клиент вводит этот код при регистрации в приложении.</p></div><div class="card" style="margin-top:14px"><b>Тема оформления</b><div class="tabbar">'+[['light','Светлая'],['dark','Тёмная'],['auto','Авто']].map(function(x){return '<button class="'+(S.theme===x[0]?'on':'')+'" data-act="theme2" data-t="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div></div><div class="card" style="margin-top:14px"><b>Данные</b><p style="font-size:13px;color:var(--tx2);margin:8px 0">Всё хранится в этом браузере (демо-режим).</p><div class="row"><button class="btn danger sm" data-act="resetdemo">Сбросить демо-данные</button></div></div>';
return h;}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act');
if(act==='nav')go(el.getAttribute('data-v'));
else if(act==='theme')setTheme();
else if(act==='theme2'){S.theme=el.getAttribute('data-t');save();applyTheme();render();}
else if(act==='closemodal2')closeModal();else if(act==='closemodal'&&e.target.id==='modal')closeModal();
else if(act==='client')openClient(el.getAttribute('data-id'));
else if(act==='ctab')clientTab(el.getAttribute('data-t'));
else if(act==='cnotesSave'){var c=clientById(window._cid);c.notes=document.getElementById('cnotes').textContent;c.tags=document.getElementById('ctags').value.split(',').map(function(s){return s.trim();}).filter(Boolean);save();toast('Сохранено ✅');}
else if(act==='delclient'){S.clients=S.clients.filter(function(x){return x.id!==window._cid;});save();closeModal();render();toast('Клиент удалён');}
else if(act==='addquest'){var n=prompt('Название квеста:');if(!n)return;var c3=clientById(window._cid);c3.quests.push({n:n,d:0,t:21});save();clientTab('quests');}
else if(act==='delquest'){var c4=clientById(window._cid);c4.quests.splice(+el.getAttribute('data-i'),1);save();clientTab('quests');}
else if(act==='addmeas'){var c5=clientById(window._cid),w=parseFloat(document.getElementById('mw').value);if(!w)return;var d=new Date();c5.measures.push({d:d.getDate()+'.'+(d.getMonth()+1),w:w});save();clientTab('meas');toast('Замер добавлен');}
else if(act==='sendmsg')sendMsg();
else if(act==='addclient'){var n=prompt('Имя клиента:');if(!n)return;var id='c'+Date.now();S.clients.push({id:id,name:n,login:'user'+Math.floor(Math.random()*900+100),pass:'1234',emoji:'🙂',c:'#8b5cf6',xp:0,streak:0,blockDay:0,blockLen:21,disc:0,lastActive:0,sub:{left:0,total:8,frozen:false},notes:'',tags:[],quests:[],measures:[],chat:[],report:null});save();render();toast('Клиент создан');}
else if(act==='addsess'){modal('<b style="font-size:17px">Новое занятие</b><label class="fl">Название</label><input class="inp" id="st" value="Индивидуальная"><label class="fl">Тариф</label><select class="inp" id="star">'+S.tariffs.map(function(t){return '<option value="'+t.p+'">'+esc(t.n)+' — '+fmtMoney(t.p)+'</option>';}).join('')+'</select><label class="fl">День (0 — сегодня)</label><input class="inp" id="sd" type="number" value="0"><div class="row" style="margin-top:14px"><button class="btn" data-act="savesess">Создать</button></div>');}
else if(act==='savesess'){S.sessions.push({id:'s'+Date.now(),date:+document.getElementById('sd').value||0,time:'10:00',title:document.getElementById('st').value||'Занятие',price:+document.getElementById('star').value,type:'indiv',who:[],paid:[]});save();closeModal();render();toast('Занятие создано');}
else if(act==='delsess'){S.sessions=S.sessions.filter(function(x){return x.id!==el.getAttribute('data-id');});save();render();}
else if(act==='approve'){var c6=clientById(el.getAttribute('data-id'));c6.xp+=50;c6.streak++;c6.lastActive=0;c6.report=null;save();render();toast('Засчитано! +50 XP для '+c6.name.split(' ')[0]);}
else if(act==='reject'){var c7=clientById(el.getAttribute('data-id'));c7.report=null;save();render();toast('Отчёт отклонён');}
else if(act==='addreward'){var n2=prompt('Название награды:');if(!n2)return;var c8=prompt('Цена в XP:');S.rewards.push({n:n2,cost:+c8||100});save();render();}
else if(act==='delreward'){S.rewards.splice(+el.getAttribute('data-i'),1);save();render();}
else if(act==='okpurchase'){S.purchases.splice(+el.getAttribute('data-i'),1);save();render();toast('Награда выдана 🎁');}
else if(act==='copycode'){navigator.clipboard&&navigator.clipboard.writeText(S.invite);toast('Код скопирован');}
else if(act==='resetdemo'){S=demo();S.auth=true;save();applyTheme();renderNav();render();toast('Демо-данные восстановлены');}});
function tryLogin(){var p=document.getElementById('pw');if(p.value==='1234'){S.auth=true;save();renderNav();render();document.getElementById('nav').style.display='flex';}else toast('Неверный пароль');}
function boot(){applyTheme();
if(S.auth){renderNav();render();return;}
document.getElementById('nav').style.display='none';
document.getElementById('app').innerHTML='<div style="max-width:380px;margin:12vh auto"><div class="card" style="padding:30px;text-align:center"><div style="font-size:44px">🏋️</div><h1 style="font-size:22px;margin:10px 0">Кабинет тренера</h1><p style="color:var(--tx2);font-size:14px;margin-bottom:16px">Демо-пароль: 1234</p><input class="inp" id="pw" type="password" placeholder="Пароль" onkeydown="if(event.key===&apos;Enter&apos;)tryLogin()"><button class="btn" style="width:100%;margin-top:14px;justify-content:center" data-act="login2" onclick="tryLogin()">Войти</button></div></div>';}
boot();
</script>
</body></html>
