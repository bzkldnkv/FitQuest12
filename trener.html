else if(act==='delreward'){S.rewards.splice(+el.getAttribute('data-i'),1);save();render();}
else if(act==='okpurchase'){S.purchases.splice(+el.getAttribute('data-i'),1);save();render();toast('Награда выдана 🎁');}
else if(act==='copycode'){navigator.clipboard&&navigator.clipboard.writeText(S.invite);toast('Код скопирован');}
else if(act==='resetdemo'){S=demo();S.auth=true;ensureEx();save();applyTheme();renderNav();render();toast('Демо-данные восстановлены');}});
function tryLogin(){var p=document.getElementById('pw');if(p.value==='1234'){S.auth=true;save();renderNav();render();document.getElementById('nav').style.display='flex';}else toast('Неверный пароль');}
function boot(){applyTheme();try{if(localStorage.getItem('fq_side')==='1')document.body.classList.add('sidehide');}catch(e){}
var hd=document.getElementById('hdrdate');if(hd)hd.textContent=fmt(new Date());
if(S.auth){renderNav();render();return;}
document.getElementById('nav').style.display='none';
document.getElementById('app').innerHTML='<div style="max-width:380px;margin:12vh auto"><div class="card" style="padding:30px;text-align:center"><div style="font-size:44px">🏋️</div><h1 style="font-size:22px;margin:10px 0">Кабинет тренера</h1><p style="color:var(--tx2);font-size:14px;margin-bottom:16px">Демо-пароль: 1234</p><input class="inp" id="pw" type="password" placeholder="Пароль" onkeydown="if(event.key===&apos;Enter&apos;)tryLogin()"><button class="btn" style="width:100%;margin-top:14px;justify-content:center" data-act="login2" onclick="tryLogin()">Войти</button></div></div>';}
boot();
</script>
</body></html>
